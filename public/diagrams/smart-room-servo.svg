<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 444" width="720" height="444" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="444" fill="#ffffff"/>
<text x="40" y="36" font-size="20" font-weight="700" fill="#111">Servo_Switch - schematic</text>
<text x="40" y="58" font-size="13" fill="#555">Single SG90 servo bench test (serial-driven angle)</text>
<rect x="40" y="80" width="170" height="144" rx="8" fill="#eef3fb" stroke="#1d3557" stroke-width="2"/>
<text x="125.0" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3557">ESP32 Dev Module</text>
<text x="125.0" y="122" text-anchor="middle" font-size="11" fill="#555">powered over USB</text>
<rect x="340" y="90" width="200" height="102" rx="8" fill="#fafafa" stroke="#444" stroke-width="1.5"/>
<text x="440.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#111">SG90 servo</text>
<text x="440.0" y="128" text-anchor="middle" font-size="11" fill="#666">switch flipper</text>
<line x1="210" y1="148" x2="340" y2="148" stroke="#1d70b8" stroke-width="2.5"/>
<circle cx="210" cy="148" r="4" fill="#1d70b8"/><circle cx="340" cy="148" r="4" fill="#1d70b8"/>
<text x="200" y="152" text-anchor="end" font-size="12" font-weight="600" fill="#1d3557">GPIO13</text>
<text x="350" y="152" font-size="12" fill="#111">SIG (orange)</text>
<line x1="540" y1="148" x2="585" y2="148" stroke="#d62828" stroke-width="2.5"/>
<circle cx="540" cy="148" r="4" fill="#d62828"/><circle cx="585" cy="148" r="3.5" fill="#d62828"/>
<text x="530" y="152" text-anchor="end" font-size="12" fill="#111">V+ (red)</text>
<line x1="540" y1="174" x2="610" y2="174" stroke="#222222" stroke-width="2.5"/>
<circle cx="540" cy="174" r="4" fill="#222222"/><circle cx="610" cy="174" r="3.5" fill="#222222"/>
<text x="530" y="178" text-anchor="end" font-size="12" fill="#111">GND (brown)</text>
<line x1="585" y1="148" x2="585" y2="264" stroke="#d62828" stroke-width="3"/>
<line x1="610" y1="174" x2="610" y2="264" stroke="#222222" stroke-width="3"/>
<rect x="520" y="264" width="190" height="64" rx="8" fill="#fff4e0" stroke="#8a5a00" stroke-width="2"/>
<text x="615" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#5c3b00">HW-131 power module</text>
<text x="615" y="314" text-anchor="middle" font-size="11" fill="#7a5a20">own supply - not the ESP32 regulator</text>
<text x="585" y="278" text-anchor="middle" font-size="10" font-weight="700" fill="#d62828">5V</text>
<text x="610" y="278" text-anchor="middle" font-size="10" font-weight="700" fill="#222222">GND</text>
<circle cx="125.0" cy="224" r="4" fill="#222"/>
<text x="125.0" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#1d3557">GND</text>
<polyline points="125.0,224 125.0,358 610,358 610,328" fill="none" stroke="#222" stroke-width="2.5" stroke-dasharray="7 4"/>
<circle cx="610" cy="328" r="4" fill="#222"/>
<text x="135.0" y="352" font-size="11" fill="#222">common GND (ESP32 to HW-131)</text>
<text x="40" y="392" font-size="12" fill="#444">Wire each line as ONE continuous jumper - chained jumpers add resistance and trigger brownouts.</text>
<text x="40" y="410" font-size="12" fill="#444">Signal wires are colored; red = 5V, orange = 3.3V, black = GND. Pin names follow the common module silkscreen.</text>
</svg>
